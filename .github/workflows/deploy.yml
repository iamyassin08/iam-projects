# Test, build, then deploy to Coolify whenever the app changes on main
# (a push, or a merged pull request). Pull requests only run the checks.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   COOLIFY_URL       e.g. https://cloud.example.com   (your Coolify dashboard URL)
#   COOLIFY_TOKEN     Coolify → Keys & Tokens → API tokens (permission: deploy)
#   COOLIFY_APP_UUID  the IAM Projects resource UUID (in its URL in Coolify)
name: Test and deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Backend tests
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Docker image builds
        run: docker build -t iam-projects:ci .

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "::warning::Coolify secrets are not set; skipping deploy. See docs/DEPLOY-COOLIFY.md"
            exit 0
          fi
          curl --fail-with-body -sS -X GET \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"
